global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  static_map: true

inflation_layer:
    enabled: true
    cost_scaling_factor: 10.0  # Augmente ou diminue l'influence des obstacles
    inflation_radius: 0.3      # Rayon autour des obstacles (diminue si trop grand)
