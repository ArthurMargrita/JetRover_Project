# costmap_common_params.yaml

footprint: "[[0.0, -0.13], [0.0, 0.13], [0.17, 0.13], [0.17, -0.13]]"

obstacle_layer:
  enabled: true
  combination_method: 1
  track_unknown_space: true
  obstacle_range: 3.0
  raytrace_range: 3.5
  observation_sources: scan_filtered
  scan_filtered: {
    sensor_frame: base_footprint,
    observation_persistence: 0.0,
    max_obstacle_height: 0.6,
    min_obstacle_height: 0.0,
    data_type: LaserScan,
    topic: /scan,    # Utilisation du scan filtré
    marking: true,
    clearing: true
    }
 
static_layer:
  enabled: true
  map_topic: "/map"

